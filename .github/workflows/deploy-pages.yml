name: GitHub Pages yayını

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda tek yayın çalışsın
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Statik site: depo kökü olduğu gibi gh-pages dalına yayınlanır.
      # Pages kaynağı "Deploy from a branch → gh-pages / (root)" olarak çalışır.
      - name: gh-pages dalına yayınla
        run: |
          set -e
          mkdir -p ../site
          rsync -a --exclude='.git' --exclude='.github' ./ ../site/
          touch ../site/.nojekyll
          cd ../site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Yayın: ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
